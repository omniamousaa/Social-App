<header class="top-0 left-0 z-50 w-full bg-black px-6 py-4 fixed">
  <div class="mx-auto flex max-w-[1600px] items-center justify-between gap-6">
<!-- Logo -->
    <h1 class="shrink-0 text-3xl font-extrabold italic text-lime-400">
      VYBE!
    </h1>
<!-- Search + Links -->
    <div class="flex flex-1 items-center justify-center gap-6">
      <input type="search" placeholder="Search people, vibes, memes..." class="w-full max-w-sm rounded-xl border border-lime-400 bg-gray-900 px-4 py-3 text-sm text-white outline-none transition focus:border-lime-400"/>
  <!-- Star -->
  <svg class="h-7 w-7 shrink-0 -rotate-12 text-zinc-200"
    viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M16 2 19 11 29 7 23 15 29 24 19 21 15 30 12 20 3 23 9 15 4 7 13 11Z"/>
  </svg>
  <!-- Home -->
  <a href="#" class="ms-10 flex shrink-0 flex-col items-center gap-1
                     text-lime-400">
    <svg class="h-5 w-5" viewBox="0 0 24 24"
         fill="currentColor">
      <path d="M3 10 12 3l9 7v10h-6v-7H9v7H3Z"/>
    </svg>
    <span class="text-[9px]">Home</span>
  </a>

  <!-- Discover -->
  <a href="#" class="flex shrink-0 flex-col items-center gap-1
                     text-zinc-300 hover:text-lime-400">
    <svg class="h-5 w-5" viewBox="0 0 24 24"
         fill="none" stroke="currentColor" stroke-width="1.6">
      <circle cx="12" cy="12" r="9"/>
      <path d="m15.8 8.2-2.4 5.2-5.2 2.4 2.4-5.2Z"/>
    </svg>
    <span class="text-[9px]">Discover</span>
  </a>

  <!-- Create -->
  <a href="#" class="flex shrink-0 flex-col items-center gap-1
                     text-zinc-300 hover:text-lime-400">
    <span class="flex h-[22px] w-[22px] items-center
                 justify-center rounded-md border border-lime-400">
      <svg class="h-4 w-4" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M12 5v14M5 12h14"/>
      </svg>
    </span>
    <span class="text-[9px]">Create</span>
  </a>

  <!-- Communities -->
  <a href="#" class="flex shrink-0 flex-col items-center gap-1
                     text-zinc-300 hover:text-lime-400">
    <svg class="h-5 w-5" viewBox="0 0 24 24"
         fill="none" stroke="currentColor" stroke-width="1.6">
      <circle cx="9" cy="8" r="3.5"/>
      <circle cx="17" cy="9" r="2.5"/>
      <path d="M2.5 20v-2a6.5 6.5 0 0 1 13 0v2Z"/>
      <path d="M16 14a5 5 0 0 1 5.5 5v1H17"/>
    </svg>
    <span class="text-[9px]">Communities</span>
  </a>
    </div>
<!-- Right Actions -->
  <div class="ml-auto flex shrink-0 items-center gap-5">

    <!-- Messages -->
    <button class="relative text-zinc-300 hover:text-white">
      <svg class="h-5 w-5" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="1.6">
        <path d="M21 11.5a8.5 8.5 0 0 1-12.4 7.6L3 21l1.9-5.7
                 A8.5 8.5 0 1 1 21 11.5Z"/>
        <path d="M8 12h.01M12 12h.01M16 12h.01"/>
      </svg>
      <span class="absolute -right-1.5 -top-1.5 flex h-3 min-w-3 items-center justify-center rounded-full bg-pink-600 px-[3px] text-[8px] font-bold text-white">8</span>
    </button>

    <!-- Notifications -->
    <button class="relative text-zinc-300 hover:text-white">
      <svg class="h-5 w-5" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="1.6">
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
        <path d="M10 21h4"/>
      </svg>
      <span class="absolute -right-1.5 -top-1.5 flex h-3 min-w-3
                   items-center justify-center rounded-full bg-pink-600
                   px-[3px] text-[8px] font-bold text-white">12</span>
    </button>

    </div>
<!-- User Menu -->
    <div class="relative shrink-0">
      <button
        type="button"
        id="user-menu-button"
        data-dropdown-toggle="user-dropdown"
        data-dropdown-placement="bottom-end"
        aria-expanded="false"
        class="rounded-full ring-2 ring-transparent transition hover:ring-lime-400"
      >
        <img
          class="h-10 w-10 rounded-full object-cover"
          [src]="loggedInUserData().photo"
          alt="User photo"
        />
      </button>

      <!-- Dropdown -->
      <div
        id="user-dropdown"
        class="z-50 hidden w-52 rounded-xl border border-gray-800 bg-gray-900 text-white shadow-xl"
      >
        <div class="border-b border-gray-800 px-4 py-3">
          <span class="block text-sm font-semibold">{{ loggedInUserData().name }}</span>
          <span class="block truncate text-xs text-gray-400">
            {{ loggedInUserData().email }}
          </span>
        </div>

        <ul class="p-2 text-sm">
          <li>
            <a href="#"
              class="block rounded-lg px-3 py-2 transition hover:bg-gray-800 hover:text-lime-400">
              Settings
            </a>
          </li>

          <li>
            <button
              type="button"
              (click)="navbarlogout()"
              class="w-full rounded-lg px-3 py-2 text-left transition hover:bg-gray-800 hover:text-lime-400">
              Sign out
            </button>
          </li>
        </ul>
      </div>
    </div>
  </div>
</header>
